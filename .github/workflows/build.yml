name: build

on:
  push:
    branches: [main]
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  pull_request:

jobs:
  linux:
    # Ubuntu 22.04 (glibc 2.35, GCC 11) keeps the binary loadable on older
    # distributions, the same baseline as PlotJuggler's official plugins.
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build zip

      - name: Cache plugin SDK
        id: sdk-cache
        uses: actions/cache@v4
        with:
          path: ~/pj-sdk
          key: pj-sdk-ubuntu-22.04-${{ hashFiles('scripts/build-sdk.sh') }}

      - name: Build plugin SDK
        if: steps.sdk-cache.outputs.cache-hit != 'true'
        run: scripts/build-sdk.sh ~/pj-sdk

      - name: Build
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH=$HOME/pj-sdk
          cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Package
        run: scripts/package.sh build dist linux x86_64

      - uses: actions/upload-artifact@v4
        with:
          name: segger-rtt-streamer-linux-x86_64
          path: dist/

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: linux
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Check tag matches manifest version
        run: |
          version=$(python3 -c "import json; print(json.load(open('manifest.json'))['version'])")
          if [ "${GITHUB_REF_NAME#v}" != "$version" ]; then
            echo "tag $GITHUB_REF_NAME does not match manifest.json version $version"
            exit 1
          fi

      - uses: actions/download-artifact@v4
        with:
          name: segger-rtt-streamer-linux-x86_64
          path: dist

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "$GITHUB_REF_NAME" \
            --notes "Plugin for PlotJuggler 4 (plotjuggler_sdk 0.34.1). Linux x86_64 only for now."
